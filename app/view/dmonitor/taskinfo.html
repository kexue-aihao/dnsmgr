{extend name="common/layout" /}
{block name="title"}切换记录{/block}
{block name="main"}
<style>
tbody tr>td:nth-child(4){overflow: hidden;text-overflow: ellipsis;white-space: nowrap;max-width:180px;}
</style>
<div class="row">
	<div class="col-xs-12 center-block" style="float: none;">
	<div class="panel panel-default panel-intro">
	<div class="panel-body">
	
<form onsubmit="return searchSubmit()" method="GET" class="form-inline" id="searchToolbar">
  <div class="form-group">
	<label>搜索</label>
	<div class="form-group">
		<select name="action" class="form-control"><option value="0">操作类型</option><option value="1">发生异常</option><option value="2">恢复正常</option></select>
	  </div>
  </div>
  <button type="submit" class="btn btn-primary"><i class="fa fa-search"></i> 搜索</button>
  <a href="javascript:searchClear()" class="btn btn-default" title="刷新日志列表"><i class="fa fa-refresh"></i> 刷新</a>
  <a href="/dmonitor/task" class="btn btn-default"><i class="fa fa-reply fa-fw"></i> 返回</a>
  &nbsp;&nbsp;24H告警次数：<strong>{$info.fail_count}</strong>&nbsp;&nbsp;切换次数：<strong>{$info.switch_count}</strong>
  {if $info.backup_mode==1}&nbsp;&nbsp;备用池剩余：<strong>{$info.pool_count}</strong>{/if}
</form>

      <table id="listTable">
	  </table>
    </div>
  </div>
</div>
</div>

{if $info.backup_mode==1}
<div class="row">
	<div class="col-xs-12 center-block" style="float: none;">
	<div class="panel panel-default">
	<div class="panel-heading"><h3 class="panel-title">备用IP池管理</h3></div>
	<div class="panel-body">
		<form onsubmit="return false" class="form-inline" style="margin-bottom:15px">
			<div class="form-group">
				<textarea id="pool_ips" rows="3" class="form-control" style="width:420px" placeholder="每行一个IP"></textarea>
			</div>
			<button type="button" class="btn btn-success" onclick="poolAdd()"><i class="fa fa-plus"></i> 添加IP</button>
			<button type="button" class="btn btn-warning" onclick="poolClear()"><i class="fa fa-trash"></i> 清空池</button>
		</form>
		<table id="poolTable"></table>
	</div>
	</div>
	</div>
</div>
{/if}
{/block}
{block name="script"}
<script src="/static/js/layer/layer.js"></script>
<script src="/static/js/bootstrap-table-1.21.4.min.js"></script>
<script src="/static/js/bootstrap-table-page-jump-to-1.21.4.min.js"></script>
<script src="/static/js/custom.js?v=1006"></script>
<script>
var action_name = {$info.action_name|json_encode|raw};
var task_id = {$info.id};
var backup_mode = {$info.backup_mode|default=0};
$(document).ready(function(){
	updateToolbar();
	const pageSizeKey = 'dmtaskinfo_pagesize';
	const pageNumber = typeof window.$_GET['pageNumber'] != 'undefined' ? parseInt(window.$_GET['pageNumber']) : 1;
	const pageSize = getStoredPageSize(pageSizeKey);

	$("#listTable").bootstrapTable({
		url: '/dmonitor/task/log/data/{$info.id}',
		pageNumber: pageNumber,
		pageSize: pageSize,
		classes: 'table table-striped table-hover table-bordered',
		columns: [
			{
				field: 'id',
				title: 'ID'
			},
			{
				field: 'action',
				title: '操作类型',
				formatter: function(value, row, index) {
					return action_name[value];
				}
			},
			{
				field: 'date',
				title: '时间'
			},
			{
				field: 'errmsg',
				title: '异常原因'
			}
		],
		onPageChange: function(number, size){
			setStoredPageSize(pageSizeKey, size);
		},
	});

	if(backup_mode == 1){
		$("#poolTable").bootstrapTable({
			url: '/dmonitor/pool/data/'+task_id,
			classes: 'table table-striped table-hover table-bordered',
			columns: [
				{field:'id', title:'ID'},
				{field:'ip', title:'备用IP'},
				{field:'sort', title:'顺序'},
				{field:'addtimestr', title:'添加时间'},
				{
					field:'op',
					title:'操作',
					formatter: function(value, row){
						return '<a href="javascript:poolDelete(\''+row.ip+'\')" class="btn btn-xs btn-danger">删除</a>';
					}
				}
			]
		});
	}
});

function poolAdd(){
	var ips = $('#pool_ips').val();
	if(!ips){ layer.msg('请填写IP', {time:800}); return; }
	var ii = layer.load(2, {shade:[0.1,'#fff']});
	$.post('/dmonitor/pool/add', {task_id: task_id, ips: ips}, function(data){
		layer.close(ii);
		if(data.code == 0){
			layer.msg(data.msg, {icon:1, time:1000});
			$('#pool_ips').val('');
			$("#poolTable").bootstrapTable('refresh');
		}else{
			layer.alert(data.msg, {icon:2});
		}
	}, 'json');
}

function poolDelete(ip){
	layer.confirm('确定删除备用IP '+ip+' ？', {icon:3, title:'提示'}, function(index){
		layer.close(index);
		var ii = layer.load(2, {shade:[0.1,'#fff']});
		$.post('/dmonitor/pool/delete', {task_id: task_id, ip: ip}, function(data){
			layer.close(ii);
			if(data.code == 0){
				layer.msg(data.msg, {icon:1, time:800});
				$("#poolTable").bootstrapTable('refresh');
			}else{
				layer.alert(data.msg, {icon:2});
			}
		}, 'json');
	});
}

function poolClear(){
	layer.confirm('确定清空全部备用IP？', {icon:3, title:'提示'}, function(index){
		layer.close(index);
		var ii = layer.load(2, {shade:[0.1,'#fff']});
		$.post('/dmonitor/pool/clear', {task_id: task_id}, function(data){
			layer.close(ii);
			if(data.code == 0){
				layer.msg(data.msg, {icon:1, time:800});
				$("#poolTable").bootstrapTable('refresh');
			}else{
				layer.alert(data.msg, {icon:2});
			}
		}, 'json');
	});
}
</script>
{/block}
